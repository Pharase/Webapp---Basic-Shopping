<main class="credential-page">
  <a routerLink="/" class="brand">Borrow&lend</a>
  <section class="credential-card" aria-labelledby="credential-title">
    <p class="eyebrow">Member access</p>
    @if (submitted()) {
      <h1 id="credential-title">You are signed in.</h1>
      <p class="muted">Your account is ready for live stock and checkout.</p>
      <a routerLink="/" class="primary-link">Return to store <span>-></span></a>
    } @else {
      <h1 id="credential-title">Welcome back.</h1>
      <p class="muted">Sign in to see stock levels and add pieces to your bag.</p>
      <form (ngSubmit)="signIn()">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" [(ngModel)]="email" autocomplete="email" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" [(ngModel)]="password" autocomplete="current-password" required>
        @if (error()) { <p class="error" role="alert">{{ error() }}</p> }
        <button type="submit">Continue <span>-></span></button>
      </form>
    }
  </section>
</main>
